# Firebase App Hosting Configuration
# Reference: https://firebase.google.com/docs/app-hosting/configure

# Compute settings for Cloud Run backend
runConfig:
  minInstances: 0        # Scale to zero when idle to prevent unnecessary compute charges
  maxInstances: 2        # Conservative instance cap for budget protection
  concurrency: 80        # Concurrent requests per container instance
  cpu: 1                 # 1 vCPU
  memoryMiB: 512         # 512 MiB memory allocation

# Environment configuration
env:
  - variable: NODE_ENV
    value: production
